<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Very Long Job Post With An Extremely Long Title That Keeps Going To Test Truncation In Every Place It Appears</title></head>
<body style="font-family:sans-serif;padding:16px">
<h1>Very long post</h1>
<script>
  var p = document.createElement('p');
  p.textContent = Array(4000).join('Remote APAC role building Node.js services. ');
  document.body.appendChild(p);
  var f = document.createElement('form');
  for (var i = 0; i < 120; i++) {
    var input = document.createElement('input');
    input.name = 'q' + i;
    input.setAttribute('aria-label', 'Question ' + i);
    f.appendChild(input);
  }
  document.body.appendChild(f);
</script>
</body></html>
