appId: io.github.tawhidumar9.jobify
env:
  BASE_URL: "http://localhost:8787"
---
- launchApp:
    clearState: true

- runFlow: _onboard.yaml

# Log one job application first so Insights has data
- openLink: "jobify:///?url=http%3A%2F%2Flocalhost%3A8787%2Ffixtures%2Fjob-remote-form.html"
- extendedWaitUntil:
    visible:
      id: "analyze-fab"
    timeout: 15000

- tapOn:
    id: "analyze-fab"

- extendedWaitUntil:
    visible:
      id: "action-log-application"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "action-log-application"
    direction: DOWN
    timeout: 15000

- tapOn:
    id: "action-log-application"
- assertVisible: "Logged"

- tapOn:
    id: "copilot-close"

# AT-34: Open Insights screen from Tracker
- tapOn:
    id: "tab-tracker"
- extendedWaitUntil:
    visible:
      id: "tracker-screen"
    timeout: 15000
- tapOn:
    id: "tracker-insights"
- extendedWaitUntil:
    visible:
      id: "insights-screen"
    timeout: 15000

- assertVisible:
    id: "insights-screen"
