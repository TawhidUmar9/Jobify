appId: io.github.tawhidumar9.jobify
env:
  BASE_URL: "http://localhost:8787"
---
- launchApp:
    clearState: true

- runFlow: _onboard.yaml

# AT-21: Improve application with tailored bullets, cover note, cold DM
- openLink: "jobify:///?url=http%3A%2F%2Flocalhost%3A8787%2Ffixtures%2Fjob-remote-form.html"
- extendedWaitUntil:
    visible:
      id: "analyze-fab"
    timeout: 15000

- tapOn:
    id: "analyze-fab"

- extendedWaitUntil:
    visible:
      id: "tailor-button"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "tailor-button"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "tailor-button"

- extendedWaitUntil:
    visible:
      id: "tailor-card"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "tailor-card"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "tailor-card"

- scrollUntilVisible:
    element:
      id: "bullet-rewrite-0"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "bullet-rewrite-0"

- scrollUntilVisible:
    element:
      id: "cover-note"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "cover-note"

- scrollUntilVisible:
    element:
      id: "cold-dm-text"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "cold-dm-text"

- scrollUntilVisible:
    element:
      id: "copy-dm"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "copy-dm"
- assertVisible: "Copied"
