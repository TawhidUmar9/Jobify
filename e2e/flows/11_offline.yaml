appId: io.github.tawhidumar9.jobify
---
- launchApp:
    clearState: true

- runFlow: _onboard.yaml

# EC-03: Offline features work with no network connection
# Tracker tab works offline
- tapOn:
    id: "tab-tracker"
- extendedWaitUntil:
    visible:
      id: "tracker-screen"
    timeout: 15000
- assertVisible:
    id: "tracker-empty"

# Insights screen works offline
- tapOn:
    id: "tracker-insights"
- extendedWaitUntil:
    visible:
      id: "insights-screen"
    timeout: 15000
- back

# Settings tab works offline
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- assertVisible:
    id: "settings-screen"
- scrollUntilVisible:
    element:
      id: "settings-preferences"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-preferences"
- extendedWaitUntil:
    visible:
      id: "prefs-work-mode-remote"
    timeout: 15000
- assertVisible:
    id: "prefs-work-mode-remote"
- back
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- assertVisible:
    id: "settings-screen"
