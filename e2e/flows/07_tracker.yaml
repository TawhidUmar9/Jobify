appId: io.github.tawhidumar9.jobify
env:
  BASE_URL: "http://localhost:8787"
---
- launchApp:
    clearState: true

- runFlow: _onboard.yaml

# AT-29: Log application from Copilot
- openLink: "jobify:///?url=http%3A%2F%2Flocalhost%3A8787%2Ffixtures%2Fjob-remote-form.html"
- extendedWaitUntil:
    visible:
      id: "analyze-fab"
    timeout: 15000

- tapOn:
    id: "analyze-fab"

- extendedWaitUntil:
    visible:
      id: "action-log-application"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "action-log-application"
    direction: DOWN
    timeout: 15000

- tapOn:
    id: "action-log-application"
- assertVisible: "Logged"

- tapOn:
    id: "copilot-close"

# AT-32: View in Tracker, edit status and notes
- tapOn:
    id: "tab-tracker"
- extendedWaitUntil:
    visible:
      id: "tracker-screen"
    timeout: 15000
- extendedWaitUntil:
    visible: "Senior Backend Engineer"
    timeout: 15000

- tapOn: "Senior Backend Engineer"
- extendedWaitUntil:
    visible:
      id: "application-detail-screen"
    timeout: 15000

# Change status to Interviewing
- scrollUntilVisible:
    element:
      id: "detail-change-status"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "detail-change-status"
- extendedWaitUntil:
    visible:
      id: "status-option-INTERVIEWING"
    timeout: 15000
- tapOn:
    id: "status-option-INTERVIEWING"
- assertVisible: "Interviewing"

# Save notes
- scrollUntilVisible:
    element:
      id: "detail-notes"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "detail-notes"
- eraseText: 80
- inputText: "Interview scheduled for Monday"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "detail-save-notes"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "detail-save-notes"
- assertVisible: "Notes saved"
